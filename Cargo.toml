[package]
name = "schedule_manager"
version = "0.0.1"
edition = "2024"
about = "Manage your tasks."

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rusqlite = { version = "0.40.1", features = ["bundled"] }
